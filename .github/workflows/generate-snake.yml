name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # run every 24 hours
  workflow_dispatch: # allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Generate Snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: sandranimanohar-ui
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#F700FF&color_dots=#E1F5FE,#B3E5FC,#81D4FA,#4FC3F7,#29B6F6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F700FF&color_dots=#0D1117,#00FFFF,#00E5FF,#00D4FF,#00B8FF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
